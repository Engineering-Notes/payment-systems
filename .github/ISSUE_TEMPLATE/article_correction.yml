name: Article correction
description: A factual, numerical or technical error in one of the published articles.
title: "docs(<scope>): <short summary of the correction>"
labels: [article-correction, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Corrections keep the series accurate as a reference. Please quote the passage and point to a source.
  - type: dropdown
    id: article
    attributes:
      label: Article
      options:
        - 01 Double-entry ledgers for software engineers
        - 02 Idempotency keys for payment APIs
        - 03 The transactional outbox pattern
        - 04 Tool-calling AI agents in production
        - 05 How stablecoin transfers actually settle
        - 06 Rate limiting payment APIs
        - 07 Retries, backoff and jitter
        - 08 M-Pesa STK Push, end to end
        - 09 PostgreSQL isolation levels, by experiment
        - 10 Webhooks done right
        - 11 Reconciliation engines
        - 12 Connection pooling under load
        - 13 Optimistic vs pessimistic locking
        - 14 Timeouts and circuit breakers
        - 15 Distributed locks and fencing tokens
        - 16 Proof of reserves with Merkle trees
        - 17 Designing a payment system end to end
        - 18 Multi-currency and FX in the ledger
    validations:
      required: true
  - type: textarea
    id: passage
    attributes:
      label: Passage
      description: Quote the sentence, figure caption or code block, and name the section it appears in.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to documentation, specifications, papers, or a reproducible run of this repository's code.
    validations:
      required: true
