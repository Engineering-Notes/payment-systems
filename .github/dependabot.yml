version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /01-double-entry-ledger
      - /02-idempotency-keys
      - /03-transactional-outbox
      - /04-ai-agents-eval
      - /05-stablecoin-settlement
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
